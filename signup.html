<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Create a free CodeAcademy account and start learning to code today.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — CodeAcademy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <nav class="nav">
    <a class="nav__logo" href="index.html">Code<span>Academy</span></a>
    <button class="nav__toggle" onclick="document.querySelector('.nav__links').classList.toggle('open')">&#9776;</button>
    <ul class="nav__links">
      <li><a href="index.html">Home</a></li>
      <li><a href="instructors.html">Instructors</a></li>
      <li><a href="courses.html">Courses</a></li>
      <li class="mobile-only"><a href="login.html">Log in</a></li>
      <li class="mobile-only"><a href="signup.html">Sign up</a></li>
    </ul>
    <div class="nav__actions" data-nav-actions>
      <a class="btn btn--ghost" href="login.html">Log in</a>
      <a class="btn btn--primary btn--sm" href="signup.html">Sign up</a>
    </div>
  </nav>
</header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card__head">
      <h1>Create an Account</h1>
      <p>Start learning with CodeAcademy today.</p>
    </div>

    <div class="form-message" data-form-message></div>

    <form data-signup-form novalidate>
      <div class="field">
        <label for="fullName">Full Name *</label>
        <input id="fullName" name="fullName" type="text" autocomplete="name" required>
        <span class="field-error" data-error-for="fullName"></span>
      </div>
      <div class="field">
        <label for="email">Email Address *</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <span class="field-error" data-error-for="email"></span>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="password">Password *</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <span class="field-error" data-error-for="password"></span>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm Password *</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
          <span class="field-error" data-error-for="confirmPassword"></span>
        </div>
      </div>
      <button class="btn btn--primary btn--block" type="submit">Sign Up</button>
    </form>

    <div class="auth-card__footer">
      Already have an account? <a href="login.html" style="color:var(--ink);font-weight:600;">Log in</a>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
</body>
</html>
